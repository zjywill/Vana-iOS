name: Vana
options:
  bundleIdPrefix: com.pinapia
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Siri 短语是按 app 的开发语言登记的。这一项留在 en 的话,`VanaShortcuts` 里写的中文
  # 在中文 Siri 上一句都匹配不上——界面本来就全是中文,开发语言也该是中文。
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 生成 Info.plist 时 CFBundleDevelopmentRegion 取的是这个,不是上面那个 project 属性。
    DEVELOPMENT_LANGUAGE: zh-Hans
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    # Vana 自己的团队,TestFlight 和上架都走它。
    #
    # 2026-08-12 之前这里是 `TBZQNF7555`(Ardent Core Limited),那是另一个项目的组织账号,
    # 当时只用来做真机调试签名。**换团队会连着换掉 bundle id 能不能用**:第一次归档时
    # Xcode 顺手把当时那串 `com.pinapia.vana` 注册到了老团队名下,ASC 里也建了记录,
    # 于是它在新团队这边就再也注册不了了(全局唯一,而带记录的 App ID 删不掉)。
    # 下面那串带 `.ios` 后缀就是这么来的,详见 CLAUDE.md 开头。
    DEVELOPMENT_TEAM: NGM7GX8DGB
packages:
  # 钉在 commit 上,不钉分支。分支会动,而一次过审的 build 必须是可复现的:
  # 提交上去的那个二进制里到底是哪一版 AIKit,只能由这一行说了算。
  # 跟上游走一步 = 改这一行 + `xcodegen` + 重新解析,顺手把 `Package.resolved` 一起提交。
  AIKitSwift:
    url: https://github.com/zjywill/aikitswift
    revision: 608944b2ff9d10f2bd59d43d51c3d8b25805528b
  AgentRuntime:
    path: AgentRuntime
targets:
  VanaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VanaTests
    dependencies:
      - target: Vana
      - package: AgentRuntime
        product: AgentRuntime
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  Vana:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - VanaTests
      # **测试跑在中文下。** 界面加了英文之后,模拟器默认是英文系统,`String(localized:)`
      # 于是返回英文——而合规、首屏、Siri 那几套断言盯的是**中文原文**(它们要挡的是
      # 「声明和行为对不上」,那是逐字的)。不钉住语言的话,一加英文全挂,而挂的原因和
      # 代码没有关系。英文那一份由 catalog 保证:少一条键就没有译文,不是断言的事。
      language: zh-Hans
      region: CN
    sources:
      - path: Vana
    dependencies:
      - package: AgentRuntime
        product: AgentRuntime
      - package: AIKitSwift
        product: AIKit
    # 上面那些 `INFOPLIST_KEY_*` 走的是 Xcode 的生成器,而它只认自己列表里的那些键——
    # `NSLocationDefaultAccuracyReduced` 不在里面,写成 build setting 会被静默丢掉(试过)。
    # 所以单给它一份基础 plist:`GENERATE_INFOPLIST_FILE` 仍然开着,Xcode 会把上面那些键
    # 合并进这份文件,两条路并存。
    #
    # 这个键让 iOS 那张授权面板连「精确位置」的开关都不露出来——申请的就只是大概位置。
    # 实际拿到的数据由 `LocationProvider` 里的 `kCLLocationAccuracyReduced` 兜住,两处都要有:
    # 用户自己在系统设置里把精确位置打开了,那一行仍然把我们限制在粗定位上。
    info:
      path: Vana/Info.plist
      properties:
        NSLocationDefaultAccuracyReduced: true
        # 出口合规。只用 HTTPS 和系统自带的加密(Keychain、文件保护),属于豁免范围。
        # 不写这个键的话每次往 App Store Connect 传 build 都会被拦下来问一遍同一个问题。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Vana/Vana.entitlements
      properties:
        com.apple.developer.healthkit: true
        # 读体检报告和化验单要单独的 access 权限,只申请 health-records 这一项。
        com.apple.developer.healthkit.access:
          - health-records
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinapia.vana.ios
        PRODUCT_NAME: Vana
        # `GENERATE_INFOPLIST_FILE` 开着时,版本号这两项由**构建设置**说了算——写在
        # `Vana/Info.plist` 里的那两行会被生成器直接盖掉(试过:产物里这两个键
        # 一个都不剩)。而没有 CFBundleShortVersionString 的 build 是传不上 App Store
        # Connect 的,界面上「关于」那行版本也只显示一个破折号。
        MARKETING_VERSION: "1.1"
        # 每传一次加一位。1.0 到 11 为止仍是首发;12 起带上 workout-guide 动作库,
        # 对外版本挪到 1.1。
        #
        # 1 = 被审核拒掉的那个;2 = 传的时候撞上 error 90474(iPad 方向没声明)。
        # 3 = 2026-08-19 被拒的那个(2.1(a) 默认模型没落盘、2.5.1 界面上认不出 HealthKit)。
        # 4 = 传上去了,但「回到底部」那颗按钮贴底时也一直亮着(底部安全区算了两遍)。
        # 2 那次没被 ASC 收下,理论上还能重用,但**不值得赌**:Organizer 里已经有一条
        # 叫 1.0 (2) 的记录,再传一个同号的容易撞上 "redundant binary",而那时候
        # 归档和上传的十几分钟已经花掉了。加一位是免费的。
        CURRENT_PROJECT_VERSION: "12"
        # Icon Composer 的 Vana/AppIcon.icon,名字要和这里对上。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # 工程、target、scheme、PRODUCT_NAME、显示名和 bundle id 现在全都叫 Vana。
        # Android 那份是 `com.pinapia.vana`,这边多一个 `.ios` 后缀——不是风格选择,
        # 是没得选,原因见上面 `DEVELOPMENT_TEAM` 那段和 CLAUDE.md 开头。
        #
        # 2026-08-11 那次改名特意**没有**动 bundle id 和 `KeychainStore.service`:那时候改
        # 等于把已装设备上存的 API key 和已授权的健康数据一次性作废。2026-08-12 发第一个
        # TestFlight build 之前改掉了,理由是那条前提当时就已经不成立——
        # 唯一装着这个 app 的是开发机,而换到新的付费团队之后 Keychain 的 access group
        # (`TeamID.BundleID`)本来就变了,那把 key 无论如何都读不回来。
        #
        # **首次上传之后这一串就永久锁死了**(App Store 上的 app 改不了 bundle id),
        # 所以那是最后一次能免费改的时刻。往后不要再动它,理由回到那条原来的:
        # 它是已装设备上 API key 和已授权健康数据的钥匙。
        INFOPLIST_KEY_CFBundleDisplayName: Vana
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # 这两句是用户在系统授权面板上读到的字,**必须和 app 实际做的事逐字对上**。
        # 端上模型 2026-08-08 撤掉之后,这里一度还留着「端上模型模式下数据不离开设备」——
        # 那是在健康授权面板上许一个这个 app 已经做不到的诺,也正是审核会第一眼读到的地方。
        # 分析由用户自己配的云端模型完成,聚合数值会发出去,这一点两句里都要写明。
        INFOPLIST_KEY_NSHealthShareUsageDescription: 用于在对话中分析你的步数、睡眠、心率等健康数据。分析由你在设置里配置的云端模型完成，相关的聚合数值会发送给该服务；原始样本不会离开这台设备，Vana 也不会修改你的健康记录。
        INFOPLIST_KEY_NSHealthClinicalHealthRecordsShareUsageDescription: 用于在对话中读取你已连接到「健康」的化验和体检记录。只在你提问时读取，相关内容会发送给你在设置里配置的云端模型来分析；Vana 不会修改这些记录，也不会把它们用于广告或数据挖掘。
        # 只要粗定位:城市决定气候、季节、时差、饮食和就医方式,而那几件正是要位置的全部理由。
        # 街道地址一件都回答不了,只是多给模型一样能说漏嘴的东西。
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于让 Vana 知道你大概在哪个城市，回答季节、气候、时差和当地就医方式相关的问题；只取到城市，不取街道地址，也不会保存在本机。
        # 拍化验单、药瓶和说明书。文字识别全在本机跑，发给模型的只有识别出来的文字，图片不离开这台设备。
        INFOPLIST_KEY_NSCameraUsageDescription: 用于拍摄化验单、药瓶或说明书；文字识别在本机完成，只有识别出的文字会发给你配置的模型，照片不会离开这台设备。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于选取你已经拍好的化验单或药瓶照片；文字识别在本机完成，只有识别出的文字会发给你配置的模型，照片不会离开这台设备。
        # 按住说话。**只声明麦克风**:新的 `SpeechAnalyzer` / `SpeechTranscriber` 是本机识别,
        # 不经过 `SFSpeechRecognizer`,也就没有那条语音识别的 TCC 授权。声明一个从不申请的
        # 权限用途,审核那边是白送的一个问号(同上面写权限只放在 Debug 配置里)。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于「按住说话」把你说的话识别成文字填进输入框。识别在本机完成，录音不会保存，也不会离开这台设备；只有识别出的文字在你按发送后才会发给你配置的模型。
        # 写权限的用途字符串。**这一项必须在所有配置里都有,不要再改回 Debug-only。**
        #
        # 这个 app 一次都不请求写:唯一写健康数据的 `DebugSeeder` 整个文件是 `#if DEBUG`,
        # 正式构建里只剩 `requestAuthorization(toShare: [], read: ...)`。按「声明一个从不
        # 申请的权限是白送审核一个问号」那条,它本来只放在下面的 Debug 配置里。
        #
        # 但**上传时的静态检查认的是符号,不看你传了个空集合**:只要二进制里引用了
        # `requestAuthorization(toShare:read:)`,ASC 就拒收,报
        # "Missing purpose string in Info.plist ... should contain a
        # NSHealthUpdateUsageDescription key"(2026-08-12 第一次传 build 时撞上)。
        # HealthKit 没有只读的授权 API,所以这个符号躲不掉,只能声明。
        #
        # 于是这句话的读者不是用户(正式版永远不会弹这张面板),是审核员——所以它要写的是
        # 「不写」这件事本身。Debug 那份在下面覆盖掉,那边是真的会写。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Vana 只读取健康数据，不会写入或修改任何健康记录。这一项是系统在检测到 HealthKit 授权接口时要求声明的，Vana 不会请求写入权限。
        TARGETED_DEVICE_FAMILY: "1,2"
        # **iPad 那四个方向一个都不能少。** 声明了 iPad(device family 2)就等于加入 iPad
        # 多任务,而多任务要求 app 在任意尺寸下都立得住——ASC 把这条做成了上传时的硬校验:
        # 一个方向都不写,传上去直接被打回(error 90474,2026-08-16 撞过)。
        #
        # iPhone-only 的时候不需要这两行,所以这个坑正是"改成原生 iPad"带出来的。
        #
        # 上下颠倒只给 iPad:手机上倒过来拿基本只会是误触,而 iPad 没有"正着拿"这回事。
        #
        # **三个键都要写。** 带 `~iphone` / `~ipad` 后缀的那两个运行时优先级更高,真正决定
        # 行为的是它们;而 ASC 那条校验点名的是**不带后缀**的基础键,不写就赌它认不认后缀。
        # 赌输的代价是再传一次(归档 + 上传十几分钟),赌赢也省不下什么,所以三个都写。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_STRICT_CONCURRENCY: targeted
        # 让编译器把 `Text("…")` / `String(localized:)` 里的中文原文抽进
        # `Localizable.xcstrings`。中文是**源语言**(`developmentLanguage: zh-Hans`),
        # 英文是加上去的那一份——所以键就是中文原文,界面代码一个字都不用改写成 key。
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        # 开发版本里 `DebugSeeder` 真的会写模拟数据,所以这一句要说实话,盖掉上面那份。
        Debug:
          INFOPLIST_KEY_NSHealthUpdateUsageDescription: 仅在开发版本中写入模拟健康数据，用于验证查询和分析结果。
